# myforge agent definitions — Batch 3 (CORRECTED MODEL SLUGS)
#
# Model slugs verified against WebAI2API dashboard (localhost:3006):
#   DeepSeek:  deepseek, deepseek-thinking, deepseek-search,
#              deepseek-thinking-search, deepseek-expert, etc.
#              (also deepseek_text/* variants — same models, text-only mode)
#   Gemini:    gemini-3.1-flash, gemini-3.1-flash-thinking, gemini-3.1-pro
#              (also gemini_text/* variants)
#   ChatGPT:   gpt-instant, gpt-thinking
#
# STRATEGY:
#   Thinker:   deepseek-thinking (reasoning mode) → Groq → Gemini Flash
#   Coder:     gpt-thinking (GPT-4o class, strong code gen) → deepseek → Groq
#   Reviewer:  deepseek (fast analysis) → Groq
#   Bugfixer:  gpt-instant (targeted edits) → deepseek → Groq
#   Researcher: deepseek-search (web search mode) → gemini-3.1-flash → Groq

agents:
  thinker:
    role: "Decompose the goal into a DAG of concrete tasks."
    model:
      # Primary: DeepSeek with thinking mode — strong reasoning for planning
      primary:
        model: "deepseek/deepseek-thinking"
        api_base: "http://localhost:3006/v1"
        api_key: "sk-if-you-love-life-dont-waste-time-for-time-is-what-life-is-made-up-of"
        request_timeout: 200
      # Fallback 1: Groq Llama 3.3 — instant, reliable
      fallback: "groq/llama-3.3-70b-versatile"
      # Fallback 2: Gemini Flash API — free tier
      fallback_2: "gemini/gemini-2.0-flash"
    system_prompt_file: "llm/prompts/thinker.j2"
    temperature: 0.2
    max_tokens: 2048
    allow_mock: true
    use_tools: false
    allowed_tools: []
    min_response_length: 100  # plans should be at least 100 chars

  coder:
    role: "Implement a single task. Output ONLY code blocks."
    model:
      # Primary: ChatGPT with thinking — best code generation
      primary:
        model: "openai/gpt-thinking"
        api_base: "http://localhost:3006/v1"
        api_key: "sk-if-you-love-life-dont-waste-time-for-time-is-what-life-is-made-up-of"
        request_timeout: 200
      # Fallback 1: DeepSeek (standard mode) — code-focused
      fallback:
        model: "deepseek/deepseek"
        api_base: "http://localhost:3006/v1"
        api_key: "sk-if-you-love-life-dont-waste-time-for-time-is-what-life-is-made-up-of"
        request_timeout: 200
      # Fallback 2: Groq Llama 3.3 — instant, supports native tool calling
      fallback_2: "groq/llama-3.3-70b-versatile"
    system_prompt_file: "llm/prompts/coder.j2"
    temperature: 0.1
    max_tokens: 4096
    allow_mock: true
    use_tools: false
    min_response_length: 200  # code output should be at least 200 chars
    allowed_tools:
      - read_file
      - write_file
      - edit_file
      - list_dir
      - grep
      - glob
      - execute
      - git_status
      - git_diff
      - git_commit
      - mkdir

  reviewer:
    role: "Approve or reject coder output. List concrete defects only."
    model:
      # Primary: DeepSeek (standard mode) — strong code analysis, fast
      primary:
        model: "deepseek/deepseek"
        api_base: "http://localhost:3006/v1"
        api_key: "sk-if-you-love-life-dont-waste-time-for-time-is-what-life-is-made-up-of"
        request_timeout: 200
      # Fallback 1: Groq Llama 3.3 — instant
      fallback: "groq/llama-3.3-70b-versatile"
    system_prompt_file: "llm/prompts/reviewer.j2"
    temperature: 0.0
    max_tokens: 1024
    allow_mock: true
    use_tools: false
    allowed_tools:
      - read_file
      - list_dir
      - grep
      - execute
      - git_diff
      - git_status

  bugfixer:
    role: "Apply reviewer's defect list to the coder's prior output."
    model:
      # Primary: ChatGPT instant — best at targeted edits
      primary:
        model: "openai/gpt-instant"
        api_base: "http://localhost:3006/v1"
        api_key: "sk-if-you-love-life-dont-waste-time-for-time-is-what-life-is-made-up-of"
        request_timeout: 200
      # Fallback 1: DeepSeek (standard mode)
      fallback:
        model: "deepseek/deepseek"
        api_base: "http://localhost:3006/v1"
        api_key: "sk-if-you-love-life-dont-waste-time-for-time-is-what-life-is-made-up-of"
        request_timeout: 200
      # Fallback 2: Groq Llama 3.3
      fallback_2: "groq/llama-3.3-70b-versatile"
    system_prompt_file: "llm/prompts/bugfixer.j2"
    temperature: 0.1
    max_tokens: 4096
    allow_mock: true
    use_tools: false
    allowed_tools:
      - read_file
      - write_file
      - edit_file
      - list_dir
      - grep
      - execute
      - git_diff

  researcher:
    role: "Web-ground a task flagged needs_research=true."
    model:
      # Primary: DeepSeek with search mode — web search + synthesis
      primary:
        model: "deepseek/deepseek-search"
        api_base: "http://localhost:3006/v1"
        api_key: "sk-if-you-love-life-dont-waste-time-for-time-is-what-life-is-made-up-of"
        request_timeout: 200
      # Fallback 1: Gemini 3.1 Flash via web bridge — search grounding
      fallback:
        model: "google/gemini-3.1-flash"
        api_base: "http://localhost:3006/v1"
        api_key: "sk-if-you-love-life-dont-waste-time-for-time-is-what-life-is-made-up-of"
        request_timeout: 200
      # Fallback 2: Groq Llama 3.3
      fallback_2: "groq/llama-3.3-70b-versatile"
    system_prompt_file: "llm/prompts/researcher.j2"
    temperature: 0.3
    max_tokens: 2048
    allow_mock: true
    needs_tools: ["web"]
    use_tools: false
    allowed_tools: []

# NOTES:
#   - Model slugs verified against WebAI2API /v1/models endpoint
#   - deepseek-thinking = reasoning mode (slower, better for planning)
#   - deepseek-search = web search mode (for researcher)
#   - gpt-thinking = GPT-4o with reasoning (best for coder)
#   - gpt-instant = GPT-4o fast mode (good for bugfixer)
#   - All agents have Groq as ultimate fallback (native function calling)
#   - To verify available models: curl -H "Authorization: Bearer <key>" \
#       http://localhost:3006/v1/models
