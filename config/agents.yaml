# myforge agent definitions — SOTA Tool-Loop Edition
#
# CRITICAL: All web bridge models MUST use "openai/" prefix (NOT "anthropic/", 
# "google/", or "deepseek/"). LiteLLM uses provider-specific auth headers
# for recognized prefixes (e.g. anthropic/ → x-api-key header). WebAI2API
# expects standard "Authorization: Bearer" format. Using "openai/" prefix
# forces LiteLLM to use the correct auth format.
#
# WebAI2API model names (NO provider prefix):
#   claude-sonnet-5, claude-opus-5, claude-haiku-5, claude-auto
#   gpt-thinking, gpt-instant, gpt-pro
#   deepseek, deepseek-thinking, deepseek-search, deepseek-thinking-search
#   gemini-3.1-flash, gemini-3.1-flash-thinking, gemini-3.1-pro
#   glm-5.2, glm-5.1, glm-5, glm-4.6, glm-4.5

agents:
  thinker:
    role: "Decompose the goal into a DAG of concrete tasks."
    model:
      primary:
        model: "openai/claude-sonnet-5"
        api_base: "http://localhost:3006/v1"
        api_key: "sk-if-you-love-life-dont-waste-time-for-time-is-what-life-is-made-up-of"
        request_timeout: 200
      fallback:
        model: "openai/deepseek-thinking"
        api_base: "http://localhost:3006/v1"
        api_key: "sk-if-you-love-life-dont-waste-time-for-time-is-what-life-is-made-up-of"
        request_timeout: 200
      fallback_2: "groq/llama-3.3-70b-versatile"
    system_prompt_file: "llm/prompts/thinker.j2"
    temperature: 0.2
    max_tokens: 2048
    allow_mock: true
    use_tools: false
    allowed_tools: []
    min_response_length: 100

  coder:
    role: "Implement a single task. Output ONLY code blocks."
    model:
      primary:
        model: "openai/gpt-thinking"
        api_base: "http://localhost:3006/v1"
        api_key: "sk-if-you-love-life-dont-waste-time-for-time-is-what-life-is-made-up-of"
        request_timeout: 200
      fallback:
        model: "openai/claude-sonnet-5"
        api_base: "http://localhost:3006/v1"
        api_key: "sk-if-you-love-life-dont-waste-time-for-time-is-what-life-is-made-up-of"
        request_timeout: 200
      fallback_2: "groq/llama-3.3-70b-versatile"
    system_prompt_file: "llm/prompts/coder.j2"
    temperature: 0.1
    max_tokens: 4096
    allow_mock: true
    use_tools: false
    min_response_length: 200
    allowed_tools:
      - read_file
      - write_file
      - edit_file
      - list_dir
      - grep
      - glob
      - execute
      - git_status
      - git_diff
      - git_commit
      - mkdir

  reviewer:
    role: "Approve or reject coder output. List concrete defects only."
    model:
      primary:
        model: "openai/claude-sonnet-5"
        api_base: "http://localhost:3006/v1"
        api_key: "sk-if-you-love-life-dont-waste-time-for-time-is-what-life-is-made-up-of"
        request_timeout: 200
      fallback:
        model: "openai/deepseek"
        api_base: "http://localhost:3006/v1"
        api_key: "sk-if-you-love-life-dont-waste-time-for-time-is-what-life-is-made-up-of"
        request_timeout: 200
      fallback_2: "groq/llama-3.3-70b-versatile"
    system_prompt_file: "llm/prompts/reviewer.j2"
    temperature: 0.0
    max_tokens: 1024
    allow_mock: true
    use_tools: false
    min_response_length: 50
    allowed_tools:
      - read_file
      - list_dir
      - grep
      - execute
      - git_diff
      - git_status

  bugfixer:
    role: "Apply reviewer's defect list to the coder's prior output."
    model:
      primary:
        model: "openai/gpt-thinking"
        api_base: "http://localhost:3006/v1"
        api_key: "sk-if-you-love-life-dont-waste-time-for-time-is-what-life-is-made-up-of"
        request_timeout: 200
      fallback:
        model: "openai/claude-sonnet-5"
        api_base: "http://localhost:3006/v1"
        api_key: "sk-if-you-love-life-dont-waste-time-for-time-is-what-life-is-made-up-of"
        request_timeout: 200
      fallback_2: "groq/llama-3.3-70b-versatile"
    system_prompt_file: "llm/prompts/bugfixer.j2"
    temperature: 0.1
    max_tokens: 4096
    allow_mock: true
    use_tools: false
    min_response_length: 200
    allowed_tools:
      - read_file
      - write_file
      - edit_file
      - list_dir
      - grep
      - execute
      - git_diff

  researcher:
    role: "Web-ground a task flagged needs_research=true."
    model:
      primary:
        model: "openai/gemini-3.1-pro"
        api_base: "http://localhost:3006/v1"
        api_key: "sk-if-you-love-life-dont-waste-time-for-time-is-what-life-is-made-up-of"
        request_timeout: 200
      fallback:
        model: "openai/deepseek-search"
        api_base: "http://localhost:3006/v1"
        api_key: "sk-if-you-love-life-dont-waste-time-for-time-is-what-life-is-made-up-of"
        request_timeout: 200
      fallback_2: "groq/llama-3.3-70b-versatile"
    system_prompt_file: "llm/prompts/researcher.j2"
    temperature: 0.3
    max_tokens: 2048
    allow_mock: true
    needs_tools: ["web"]
    use_tools: false
    allowed_tools: []
    min_response_length: 100

# NOTES:
#   - ALL web bridge models use "openai/" prefix (NOT anthropic/, google/, etc.)
#   - This forces LiteLLM to use "Authorization: Bearer" header format
#   - WebAI2API strips the "openai/" prefix and routes by model name
#   - Groq uses "groq/" prefix (direct API, correct auth format)
#   - litellm.drop_params = True in router.py drops unsupported params
