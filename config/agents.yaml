# myforge agent definitions
# Each agent = ONE LLM call with bounded input. No chatter.
# Fallback chain is tried top-to-bottom. If all fail and allow_mock=true,
# the router returns a deterministic mock so dev never blocks on a key.

agents:
  thinker:
    role: "Decompose the goal into a DAG of concrete tasks."
    model:
      primary: "zai/glm-4.5-flash"
      fallback: "openrouter/openai/gpt-oss-120b:free"
      fallback_2: "openrouter/qwen/qwen3-next-80b-a3b-instruct:free"
    system_prompt_file: "llm/prompts/thinker.j2"
    temperature: 0.2
    max_tokens: 2048
    allow_mock: true

  coder:
    role: "Implement a single task. Output unified diff or new file content."
    model:
      primary: "openrouter/cohere/north-mini-code:free"
      fallback: "zai/glm-4.5-flash"
      fallback_2: "openrouter/qwen/qwen3-coder:free"
    system_prompt_file: "llm/prompts/coder.j2"
    temperature: 0.1
    max_tokens: 4096
    allow_mock: true

  reviewer:
    role: "Approve or reject coder output. List concrete defects only."
    model:
      primary: "zai/glm-4.5-flash"
      # fallback: "deepseek/deepseek-chat"
      fallback: "groq/llama-3.3-70b-versatile"
    system_prompt_file: "llm/prompts/reviewer.j2"
    temperature: 0.0
    max_tokens: 1024
    allow_mock: true

  bugfixer:
    role: "Apply reviewer's defect list to the coder's prior output."
    model:
      primary: "openrouter/qwen/qwen3-coder:free"
      fallback: "openrouter/cohere/north-mini-code:free"
      fallback_2: "zai/glm-4.5-flash"
    system_prompt_file: "llm/prompts/bugfixer.j2"
    temperature: 0.1
    max_tokens: 4096
    allow_mock: true

  researcher:
    role: "Web-ground a task flagged needs_research=true."
    model:
      primary: "openrouter/openai/gpt-oss-120b:free"
      fallback: "openrouter/qwen/qwen3-next-80b-a3b-instruct:free"
      fallback_2: "openrouter/meta-llama/llama-3.3-70b-instruct:free"
    system_prompt_file: "llm/prompts/researcher.j2"
    temperature: 0.3
    max_tokens: 2048
    allow_mock: true
    needs_tools: ["web"]

# The orchestrator is NOT here — it's a Python DAG executor, not an agent.
